    <script>

                extend: {
                    colors: {

                            bright: '#FFF500',
                            cyan: '#00F0FF',
                            dark: '#0B0D13',
                            card: '#121622',
                            cardHover: '#1A2032',
                            accent: '#F59E0B'
                        }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        montserrat: ['Montserrat', 'sans-serif']
                    },
                    boxShadow: {
                        'thunder-glow': '0 0 20px rgba(255, 215, 0, 0.3)',
                        'cyan-glow': '0 0 20px rgba(0, 240, 255, 0.3)'

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0B0D13;
            color: #E2E8F0;
            overflow-x: hidden;
        }

        /* Lightning Canvas Background */
        #lightning-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        .gold-text-glow {
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6), 0 0 24px rgba(255, 215, 0, 0.3);
        }

        .section-fade {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        .hidden-section {
            display: none !important;
            opacity: 0;
            transform: translateY(10px);
        }

        .glass-panel {
            background: rgba(18, 22, 34, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.15);
        }

        .glass-panel:hover {
            border-color: rgba(255, 215, 0, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0D13;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FFD700;
        }
    </style>
